[project]
name = "video-editing-portfolio"
version = "0.1.0"
description = "Video Editing Portfolio"
readme = "README.md"
authors = [
    { name = "Bandaru Manikanta", email = "bandarumanikanta1319@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "pillow==11.3.0",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "workers-py==1.17.3",
]
